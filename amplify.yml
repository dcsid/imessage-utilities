# AWS Amplify Hosting build spec for the Plan Together web app.
#
# Required environment variables (set in the Amplify Hosting console
# under "App settings" → "Environment variables"):
#   MAPBOX_TOKEN  — public Mapbox access token (pk.eyJ...). Optional;
#                   without it the web app falls back to OpenStreetMap
#                   tiles and disables Mapbox geocoding.
#
# The Amplify Console will need a single rewrite/redirect configured so
# Flutter's path-based router survives page refresh:
#   Source: </^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>
#   Target: /index.html
#   Type:   200 (Rewrite)

version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Pin Flutter to stable; the Amplify build env doesn't ship it.
        - if [ ! -d "$HOME/flutter" ]; then git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter; fi
        - export PATH="$PATH:$HOME/flutter/bin:$HOME/flutter/bin/cache/dart-sdk/bin"
        - flutter --version
        - flutter config --enable-web
        - flutter pub get
    build:
      commands:
        - export PATH="$PATH:$HOME/flutter/bin:$HOME/flutter/bin/cache/dart-sdk/bin"
        - flutter build web --release --dart-define=MAPBOX_TOKEN=$MAPBOX_TOKEN
  artifacts:
    baseDirectory: build/web
    files:
      - '**/*'
  cache:
    paths:
      - $HOME/flutter
      - $HOME/.pub-cache
